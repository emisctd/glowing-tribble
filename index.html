<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menuju Halaman...</title>
    <!-- Redirect otomatis setelah 1 detik. GANTI URL_TUJUAN_ANDA di bawah ini -->
    <meta http-equiv="refresh" content="1;url=https://ip.guide/129.134.0.0/17">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding-top: 80px; background-color: #f0f2f5; color: #1c1e21; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .1); }
        .loading { font-size: 16px; color: #65676b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading">
            <p>Halaman sedang dimuat...</p>
            <p style="font-size: 14px; color: #bcc0c4;">Mohon tunggu sebentar, Anda akan segera dialihkan.</p>
        </div>
    </div>

    <script>
        // Backup redirect menggunakan JavaScript jika Meta Refresh gagal/doblokir browser
        setTimeout(function() {
            window.location.href = "https://URL_TUJUAN_ANDA.com";
        }, 1000);
    </script>
</body>
</html>
